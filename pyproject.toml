[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain"
version = "0.1.0"
description = "Personal AI Assistant — Second Brain (Telegram)"
requires-python = ">=3.11"

# --- Phase 0 (Foundation) dependencies — active now ---
dependencies = [
    "python-telegram-bot[job-queue]>=21.4,<22",  # async Telegram bot + JobQueue (APScheduler)
    "pydantic>=2.7",
    "pydantic-settings>=2.3",                     # .env -> typed settings
    "SQLAlchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",                              # async Postgres driver
    "alembic>=1.13",                              # DB migrations
    "pgvector>=0.3",                             # SQLAlchemy Vector(1536) tipi (RAG)
    "structlog>=24.1",                            # structured logging
    "tzdata>=2024.1",                             # zoneinfo Asia/Baku (slim image tzdata gətirmir)
    "anthropic>=0.49",                            # Claude API (beyin)
    "openai>=1.50",                               # Whisper STT + text-embedding-3-small
    "httpx>=0.27",                                # fetch_url (link → save)
    "beautifulsoup4>=4.12",                       # veb səhifədən mətn çıxarma
    "pypdf>=4.2",                                 # PDF mətn çıxarma
    "python-docx>=1.1",                           # DOCX mətn çıxarma
    "azure-cognitiveservices-speech>=1.40",       # az-AZ TTS (səsli cavab, Phase 3)
    "tavily-python>=0.5",                          # web axtarış (agent web_search tool)
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
