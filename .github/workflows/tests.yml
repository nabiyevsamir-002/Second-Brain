name: Tests

# Saf məntiq testləri (DB, Telegram və API açarı lazım deyil).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Asılılıqlar
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q
