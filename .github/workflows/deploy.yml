name: Deploy to VPS

# Server-ə SSH edib botu yenidən qurur — YALNIZ ƏL İLƏ (Actions → Deploy to VPS → Run workflow).
# Phase 8: bot evdəki Windows PC-yə köçür. Avtomatik push-deploy VPS-də botu yenidən BAŞLADARDI
# → eyni Telegram tokeni ilə iki bot = "Conflict: terminated by other getUpdates". Ona görə
# push trigger-i söndürülüb; VPS-i yenidən əsas server etsən, `push:` blokunu qaytar.
# App açarları GitHub-a GETMİR — onlar yalnız server-dəki .env faylındadır.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false # deploy-lar bir-birini kəsməsin, növbə ilə getsin

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Fərqli SSH portu istifadə edirsənsə, SSH_PORT secret əlavə et və
          # aşağıdakı sətri aç:  port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            cd /root/AI-Assistant
            git pull --ff-only origin main
            docker compose up -d --build bot
            docker image prune -f
