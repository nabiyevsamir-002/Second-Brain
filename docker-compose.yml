services:
  db:
    image: pgvector/pgvector:pg16
    container_name: second_brain_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: second_brain
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    ports:
      # Yalnız localhost-a bağlıdır — public port bağlıdır (təhlükəsizlik).
      # Host tərəfdə 5433 (lokal Postgres 5432-də olduğu üçün konfliktdən qaçırıq).
      # Bot onsuz da daxili şəbəkədən "db:5432"-yə qoşulur.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d second_brain"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: second_brain_bot
    restart: unless-stopped
    env_file:
      # .env hələ yoxdursa compose səhv verməsin — bot app-səviyyəsində
      # aydın xəta verəcək (TELEGRAM_BOT_TOKEN yoxdur). DB default-la işləyir.
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    # DB host konteyner şəbəkəsində "db"-dir (env_file-dakı DATABASE_URL bununla uyğundur).

volumes:
  pgdata:
